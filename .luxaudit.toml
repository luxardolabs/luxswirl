# luxaudit — dependency CVE scan config.
# This is a two-component monorepo: the backend and agent each own a poetry.lock
# under apps/. luxaudit auto-detects only a repo-root lock, so point it at both.
[source]
paths = ["apps/backend/poetry.lock", "apps/agent/poetry.lock"]

# This repo ships TWO images, both released by `make release`, so one `ref`
# could only ever audit half the shipped surface — and the half it missed is the
# agent, which carries Playwright and the DB drivers. `{version}` is filled from
# the VERSION file, so naming them here does not pin the version a second place
# (repo.version_single_source). Added with luxaudit 0.12.0, which shipped both
# the list and the token (LUXSWIRL-244).
[image]
refs = [
  "ghcr.io/luxardolabs/luxswirl-backend:{version}",
  "ghcr.io/luxardolabs/luxswirl-agent:{version}",
]
