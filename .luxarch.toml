# luxarch key for luxswirl. Two deployable components, each its own image and its own
# `app` package: the backend (FastAPI server + HTMX portal) and the health-check agent.

[[target]]
kind = "fastapi-web"
app = "apps/backend/app"

# luxswirl enforces layering with import-linter (the lint-imports tail on `make arch`),
# so keep fw.import_linter_declared active — it went opt-in in luxarch 0.5.0.
[target.importlinter]
required = true

[target.enums]
declared = [
  "AgentApprovalStatus", "AgentStatus", "AlertTriggerType",
  "ArtifactContentType", "AssignmentMode", "BulkCheckOutcome",
  "CheckArtifactType", "CheckErrorType", "CheckHealthStatus", "CheckType",
  "DnsRecordType", "HttpMethod", "JobStatus", "JobType", "MaintenanceJobKind",
  "MaintenanceJobStatus", "NotificationProviderType", "NotificationStatus",
  "RegistrationKeyStatus", "SchedulerExecutionStatus", "SchedulerJobCategory",
  "SchedulerTriggerType", "SettingCategory", "SettingValueType", "UserRole",
]
labelled = ["UserRole", "CheckType"]

[target.hypertables]
names = ["check_results", "agent_metrics", "check_artifacts"]
models = ["CheckResult", "AgentMetric", "CheckArtifact"]

[target.uuid]
extra_id_names = ["log_id", "job_id"]

[target.allowlist]
non_request_files = [
  "app/db/database.py",
  "app/main.py",
  "app/background/job_purge.py",
  "app/background/database_maintenance.py",
  "app/scripts/migrate_encrypt_checks.py",
  # The admin-bootstrap CLI (luxarch --emit admin-bootstrap-cli): startup seed and
  # `python -m app.cli reset-password` each own their transaction.
  "app/cli.py",
]
cascading_delete_calls = [
  "\\bbulk_delete_by_ids\\b",
  "\\bdelete_check_handler\\b",
  "AgentCoreService\\.delete_agent\\b",
  "StatusPageCoreService\\.delete_status_page\\b",
  "\\bbulk_create_checks\\b",
]
uuid_typing = [
  { path = "core/exceptions.py", name = "agent_id", evidence = "raised not-found message arg, not the column" },
  { path = "schemas/import_export_schema.py", name = "agent_id", evidence = "AgentConfigExport mirrors the agent CONFIG FILE's `agent_id` key, which is an identifier STRING (\"docker-agent\") — not a registered agent's UUID. Typing it UUID is what made GET /export-agent-config fail response validation on every call" },
]
enum_freetext_columns = [
  { path = "app/models/check_artifact_model.py", column = "content_type", evidence = "MIME, open set" },
]
hypertable_unbounded = [
  { file = "artifact_crud", func = "get_stats_for_check", evidence = "check_artifacts is retention-scoped + filtered by check_id (indexed); a time bound prunes nothing (LUXSWIRL-180)" },
]
tenant_cross = [
  { function = "get_by_token_hash", evidence = "the session token IS the credential — this is the pre-auth lookup that establishes who the caller is, so there is no user to scope by yet", token_source = "apps/backend/app/services/core/auth_core_service.py" },
]
auth_public = [
  { function = "submit_setup", evidence = "first-admin /setup (admin-bootstrap asset): there is no user to authenticate yet; it 404s once any user exists (re-checked under an advisory lock in the creating transaction), requires the one-time token printed in the server log (constant-time compare) and is rate-limited 5/minute" },
]
js_network = [
  { file = "app.js", pattern = "window.location.reload(", evidence = "canonical refreshPage HX-Trigger handler" },
  { file = "database-health.js", pattern = "fetch(", evidence = "Chart.js data refresh — Section B carve-out" },
]

# ── Security posture the guards can enforce (AUDIT section: turn it ON, don't
# leave it inert). Each of these declares a fact about how luxswirl actually
# authenticates, so the matching rule stops being a hollow N/A.

[target.auth]
# The dependencies that ESTABLISH identity. get_optional_user is deliberately
# absent — it resolves to None for an anonymous visitor, so it authenticates
# nothing.
deps = [
  "get_current_user",
  "require_admin",
  "get_current_user_web",
  "require_admin_web",
  "require_editor_web",
  "verify_api_token",
]

[target.rbac]
# Admin-tier surfaces: settings (including users), registration keys, and the
# agent approval/lifecycle actions. require_admin/_web are the role gates;
# require_api_admin (ApiAdmin) is the JSON API's, where every bearer token is an
# admin credential (no role model on the API; see SECURITY.md).
admin_url_patterns = ["/settings", "/registration-keys", "/users"]
require_names = ["require_admin", "require_admin_web", "AdminUser", "AdminUserWeb", "require_api_admin", "ApiAdmin"]

# AUDIT confirmations — rules examined and found genuinely N/A, recorded so the
# next reader knows they were adjudicated rather than overlooked:
#
#   fw.feature_flag_is_not_authz / fw.feature_keys_declared — luxswirl has no
#     feature-flag mechanism. There is no require_feature dependency, no Feature
#     registry, and no feature-key literal anywhere in app/; the two operator
#     toggles (security.rate_limit_enabled, metrics.enabled) are settings read in
#     a service, not route gates. Nothing to declare and nothing to check.
#
#   fw.fields_wired_into_pipeline — no UI/config field feeds a downstream
#     pipeline whose reads could silently drop it; check configuration is read
#     back by the agent through the same schema it was written with.
#
#   fw.restricted_imports / fw.restricted_calls — the boundaries luxswirl cares
#     about (raw SQL confined to crud, layer direction, models out of views) are
#     already enforced by dedicated rules plus the import-linter contracts, so a
#     second hand-rolled pattern list would duplicate them.
#
#   fw.no_reserved_logging_keys — the fleet logging module is installed
#     (app/core/logging_config.py, configure_logging() in app/main.py): it
#     renames a colliding `extra=` key, which is the rule's documented end state.
#
#   fw.crud_base_single_pattern — every crud class is static methods taking the
#     session per call; none defines __init__, so there is one pattern already.
#
#   fw.test_engine_pool_parity — the harness isolates by rolling back one held
#     connection (tests/fixtures/db.py); the guard names this its end state.
#
#   fw.core_mutation_checks_permission — the one actor-dependent core gate (a
#     synthetic check needs an admin) takes `actor_is_admin: bool`, because the
#     JSON API has no user: every bearer token is admin-equivalent (SECURITY.md).
#     The `user_id` params on UserCoreService/AuthCoreService are the TARGET of
#     admin-gated (/users) or self-only (logout-all) routes, not an actor.
#
#   obs.* trace rules — luxswirl exports metrics only ([observability] above);
#     there is no tracing to check. Adding it is a product decision, not drift.
#
#   collector.influx_async_client_only (agent) — the agent posts results to the
#     server over HTTP; there is no InfluxDB client.

[target.surfaces]
# The operator console is one signed-in surface; the admin tier inside it
# (settings, users, registration keys, scheduler, database health,
# import/export) is gated by require_admin*. Its templates live under the
# settings roots so a change made for admins cannot land on an editor's or
# viewer's screen. Markup both use belongs in a neutral dir (components/,
# macros/, layouts/).
admin = ["pages/settings/", "partials/settings/"]
tenant = ["pages/", "partials/"]

[target.restricted]
# Boundaries no other rule covers. Each is clean today — these are floors, not
# burn-downs.
imports = [
  # The backend is async end to end and uses httpx. `requests` is a dependency
  # only because the Docker HEALTHCHECK shells out to it; a sync blocking call
  # inside a handler stalls the event loop for every other request.
  { package = "requests", allowed_files = [] },
]
calls = [
  # A NAIVE now() is the bug: every datetime here is tz-aware, and a naive one
  # compares wrong against a TIMESTAMPTZ column instead of failing loudly.
  # `datetime.now(UTC)` is fine and widely used; the canonical helper is
  # core/datetime_utils.utc_now(). Held back until 0.190.0, which taught this
  # rule the masking doctrine — before that it matched a docstring and a
  # comment DISCUSSING these calls, at two sites that already used utc_now().
  { pattern = "datetime\\.now\\(\\s*\\)", allowed_files = [] },
  { pattern = "\\butcnow\\s*\\(", allowed_files = [] },
  # Configuration is read through Pydantic Settings so it is typed, validated and
  # documented in one place. The two exceptions are a standalone migration script
  # and the documented insecure-HTTP test override.
  { pattern = "os\\.getenv\\s*\\(", allowed_files = ["core/config.py", "scripts/migrate_encrypt_checks.py"] },
]

[target.components]
# The macro catalogue. Both forms are listed on purpose: fw.component_registry
# resolves the DIRECTORY, while fw.destructive_macro_gated's "a catalogue is
# documentation, not an offer" exemption matches FILES — a swatch under the
# directory alone is still reported. Escalated; until the two rules read the
# key the same way, a new catalogue file must be added to this list or its
# destructive swatches will red.
index = [
  "partials/settings/components",
  "partials/settings/components/buttons.html",
  "partials/settings/components/layout.html",
  "partials/settings/components/badges.html",
  "partials/settings/components/colors.html",
  "partials/settings/components/macro_index.html",
]

# Macros that DESTROY — a name cannot tell you this, so the repo says it. Paired
# with [target.rbac].require_names above, this enforces that a destructive
# control is rendered inside a permission conditional. Hiding the button is not
# the authorization (the endpoint still checks); it stops the UI offering a
# read-only viewer an action the server will refuse.
# How a TEMPLATE says it gates. Added in 0.190.0 precisely because
# [rbac].require_names holds FastAPI dependency names and Jinja can never
# mention its route's dependency; it is unioned with require_names.
gate_names = ["current_user.role"]

destructive = [
  "icon_delete",
  "delete_icon_button",
  "btn_delete_text",
  "btn_revoke",
  "btn_regenerate",
  "icon_reset",
]

# Which dependency each SURFACE demands. fw.admin_endpoints_rbac asks whether ANY
# gate is present; this asks whether it is the RIGHT one — a bare CurrentUserWeb
# on /settings is authenticated and not authorized. Only the admin surfaces have
# a crisp single contract; /agents, /checks and /jobs deliberately mix viewer
# reads with editor writes, so declaring one dep for them would be a fiction.
# These prefixes are the WEB surface (the JSON API is under /api/v1), so the
# required dep is the _Web variant ONLY. Accepting either spelling is what let a
# web page answer a JSON 403 into an HTMX swap target for nine handlers: the rule
# was green because the declaration permitted both, not because the routes were
# right. A declaration that accepts both spellings cannot check the thing the two
# spellings differ on.
[[target.authz.signature]]
prefix = "/settings"
require_dep = ["AdminUserWeb", "require_admin_web"]

[[target.authz.signature]]
prefix = "/registration-keys"
require_dep = ["AdminUserWeb", "require_admin_web"]

[[target.authz.signature]]
prefix = "/scheduler"
require_dep = ["AdminUserWeb", "require_admin_web"]

[[target.authz.signature]]
prefix = "/database-health"
require_dep = ["AdminUser", "AdminUserWeb", "require_admin", "require_admin_web"]

# The WEB user routes register under /settings/users, so the /settings row above
# already covers them. This row is the JSON API's own user surface.
[[target.authz.signature]]
prefix = "/api/v1/users"
require_dep = ["AdminUser", "AdminUserWeb", "require_admin", "require_admin_web"]

# A check's configuration is a promise to the operator: every field the form
# offers has to reach the agent that runs the check, or the setting is inert.
# This repo has shipped that bug twice (a field named max_retries while handlers
# read retry_attempts; SSL thresholds configurable but recomputed from
# hard-coded values), which is exactly what this rule catches.
[[target.field_wiring]]
class_name = "Check"
source_files = [
  "services/core/check_core_service.py",
  "services/core/check_api_core_service.py",
  "api/v1/routers/check_router.py",
]
fields = [
  "check_type", "target", "enabled",
  "interval_seconds", "timeout_seconds",
  "retry_attempts", "retry_interval_seconds",
  "script_code", "check_config", "tags",
]
accessors = ["check.{field}", "Check.{field}"]

[target.observability]
# luxswirl exports Prometheus metrics (the /metrics endpoint and
# MetricsCollectorCoreService) but ships no tracing — there is no OpenTelemetry
# dependency or span helper anywhere in the app — so the metrics rules are on
# and the trace rules are not claimed.
enabled = true
signals = ["metrics"]

[target.color_tokens]
# luxswirl is a single-mode dark product — <html class="dark"> is fixed and no
# template carries a `dark:` sibling. The palette below is still declared so the
# floor is armed: if a light/dark pair is ever hand-rolled, the guard catches it
# instead of letting a second, un-tokened neutral scale in.
fg = "dark-text-primary"
"fg-muted" = "dark-text-secondary"
"fg-subtle" = "dark-text-muted"
surface = "dark-bg-primary"
"surface-2" = "dark-bg-secondary"
"surface-3" = "dark-bg-tertiary"
border = "dark-border"
"surface-muted" = "dark-surface-muted"

[target.route_smoke]
# The asserter lives in tests/_route_smoke.py and is loaded as a pytest plugin
# from tests/conftest.py. It pairs with filterwarnings=error: a deprecation only
# fails a test on a line some test executes, and this makes that "every route".
enabled = true
exempt = ["/health", "/metrics", "/api/v1/agents/{agent_id}/regenerate-key"]

[target.tenant]
# luxswirl is single-organisation: agents, checks, results, alerts and status
# pages are shared, gated by role rather than owned by a user. The one genuinely
# per-user table is sessions, so `user_id` is the ownership discriminator and
# this rule answers "can one user read or revoke another's session by id?".
column = "user_id"

[target.tenant.auth]
# Which auth marker a route carries decides whether reaching an unscoped session
# query is a leak. Admin is privileged; a plain signed-in user is not; the agent
# API-token routes are the system/collector tier.
superuser = ["AdminUser", "AdminUserWeb", "require_admin", "require_admin_web"]
tenant_user = ["CurrentUser", "CurrentUserWeb", "EditorUserWeb", "get_current_user"]
collector = [
  "verify_api_token",
  "verify_agent_token",
  # Agent-authenticated dependencies (app/api/deps.py): each proves the
  # agent's key before the route runs and yields only the agent or job id.
  "require_agent",
  "AuthenticatedAgentId",
  "require_heartbeat_sender",
  "AuthenticatedHeartbeat",
  "require_job_owner",
  "AgentOwnedJobId",
  "require_reporting_agent",
  "ReportingAgentId",
]
public_paths = ["login", "setup", "logout"]

[target.csrf]
# luxswirl runs cookie auth on SameSite=Lax with no CSRF-token layer, so the
# no-state-changing-GET invariant is the whole defense. See --playbook
# state-changing-get.
enabled = true
session_cookies = ["luxswirl_session"]
logout_get_allowed = true

[target.session]
# One session owner per request: get_db / get_db_context mint them, nothing else
# opens a second inside a handler that already holds one.
no_nesting = true

[target.templates]
lint_logic = true
# Evidence-backed template carve-outs (substring match on path). In luxarch <=0.2.0
# these lived hardcoded in the image; 0.2.1 moved them out to the repo's own config
# (they were luxswirl data, not fleet standard). Every template rule honors this list.
# NOTE: the old pages/alerts.html carve-out is intentionally absent — that orphan has
# since been deleted, so exempting it would be a phantom (evidence-less) entry.
exempt = [
  { page = "logo-demo",           evidence = "admin-only design playground, not a product page" },
]


# The health-check agent: runs checks on an interval and pushes results to the server.
# `source_client` names the long-lived client modules checked for connect()/close().
[[target]]
kind = "collector"
app = "apps/agent/app"
source_client = ["agent/reporter.py"]

[target.observability]
# The agent emits no telemetry of its own: it reports check results and its own
# health to the server over HTTP, and the server is what exports Prometheus.
exempt_reason = "agent ships no traces or metrics — it reports results and self-health to the server, which owns the /metrics surface"

[shared]
paths = ["apps/shared"]


