# gitleaks configuration for LuxSwirl.
# Run: make gitleaks   (uses `ghcr.io/gitleaks/gitleaks` with this config)

title = "LuxSwirl gitleaks config"

[extend]
# Start from gitleaks' built-in ruleset, then add the allowlist below.
useDefault = true

# Internal infrastructure hostnames must never be committed to this public repo.
# (Registry hosts etc. belong in git-ignored local config — see Makefile.local.)
# The commit-msg / pre-commit hooks in .githooks/ are the primary gate; this rule
# is the CI backstop over file content.
[[rules]]
id = "internal-infra-host"
description = "Internal infrastructure hostname (keep in git-ignored local config)"
regex = '''(?i)\binternal-host\b'''

[allowlist]
description = "Known-safe matches: OpenAPI doc examples and placeholder env values"

regexes = [
  # OpenAPI schema examples in registration_key_schema.py — illustrative, fake,
  # the literal 'abcdef1234567890' pattern makes that obvious.
  '''luxswirl_(rk|ak)_abcdef1234567890abcdef1234567890''',
  # Placeholder / required-but-empty env values used in compose + docs.
  '''(changeme|your-[a-z-]+|must be set|REPLACE_ME|<[a-z-]+>)''',
  # Documentation placeholder tokens in curl examples (YOUR_API_TOKEN, etc.).
  '''YOUR_[A-Z_]+''',
]

paths = [
  # Operator-local env files (gitignored, never committed) and example templates.
  '''\.env(\..*)?$''',
  '''\.env\.example$''',
  # Compiled bytecode — gitignored build artifacts, never committed. `dir`-mode
  # scans the filesystem so it would otherwise flag stale .pyc (e.g. pre-scrub
  # test-data caches) that aren't in the repo at all.
  '''__pycache__/''',
  '''\.pyc$''',
  # The hook scripts DEFINE the internal-ref patterns (they contain the literal
  # to grep for) — the pattern is the point, not a leak.
  '''\.githooks/''',
]
