[project]
name = "luxswirl-backend"
license = "AGPL-3.0-or-later"
# version: single source is the repo-root VERSION file (repo.version_single_source), read by
# hatchling (repo.hatchling_build_backend). dependencies + requires-python stay Poetry-sourced
# from [tool.poetry] below (declared dynamic so Poetry, not [project], owns them). No static
# version literal anywhere in the repo.
dynamic = ["version", "dependencies", "requires-python"]

[tool.hatch.version]
path = "../../VERSION"
# VERSION is a bare version string. Hatchling's default regex looks for
# `__version__ = "..."`, matches nothing here, and the wheel build dies with
# "unable to parse the version from the file" (repo.hatch_version_source_buildable).
pattern = "(?P<version>.+)"

[tool.poetry]
# App: deployed via `poetry install --no-root`, never packaged → non-package mode. Poetry manages
# deps (below) but does not build/version the root, which is what allows the dynamic version above
# (poetry package-mode would otherwise require a static [tool.poetry.version]).
name = "luxswirl-backend"
description = "LuxSwirl observability platform — FastAPI server + HTMX portal"
authors = ["Luxardo Labs"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
# FastAPI & Server
fastapi = "^0.141.0"  # >=0.140 admits starlette 1.x; 0.136 pinned the old line
uvicorn = {extras = ["standard"], version = "^0.53.0"}
jinja2 = "^3.1.0"
python-multipart = ">=0.0.31,<0.1.0"  # CVE-2026-53538/53539/53540 floor

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.1"}
asyncpg = "^0.31.0"
alembic = "^1.20.0"

# Pydantic
pydantic = {extras = ["email"], version = "^2.13.5"}
pydantic-settings = "^2.14.2"  # GHSA-4xgf-cpjx-pc3j floor

# HTTP Client
httpx = "^0.28.1"
requests = "^2.31.0"  # healthcheck

# Async I/O
aiofiles = "^25.1.0"
aiosmtplib = "^5.1.3"  # CVE-2026-55558 floor

# YAML & JSON (shared/config.py + import/export)
pyyaml = "^6.0"
jsonschema = "^4.17.3"

# Metrics
prometheus-client = "^0.26.0"

# System metrics
psutil = "^7.1.2"

# UUID v7 (time-ordered UUIDs)
uuid7 = "^0.1.0"

# Security
PyJWT = "^2.10"  # sole JWT lib. python-jose was dropped: unmaintained, and it pulls
                 # ecdsa, whose Minerva timing CVE (PYSEC-2026-1325) has NO fix released.
bcrypt = "^5.0.0"
cryptography = "^50.0.0"  # CVE-2026-69247/69248/69249 + GHSA-537c-gmf6-5ccf floor

# Rate Limiting
slowapi = "^0.1.10"

# Transitive-dependency CVE floors. These are pulled in by fastapi, whose own
# ranges still admit the vulnerable versions — so a re-lock alone cannot raise them; the floor
# has to be declared here (luxaudit ONBOARDING: "a CVE fix needs a version floor").
typing-extensions = ">=4.16.0"  # anyio 4.14.2 imports typing_extensions.sentinel
                                # (added in 4.16) WITHOUT declaring the floor, so a
                                # resolve picks 4.15 and every import of fastapi dies
anyio = ">=4.14.2"     # CVE-2026-63374 (IDNA TLS hostname) + CVE-2026-64847
                       # (undrained worker stderr pipe); via starlette/httpx
starlette = ">=1.6.0"   # CVE-2026-54282/54283 (via fastapi). fastapi itself only asks
                        # for >=0.46.0, which still admits the vulnerable line, so this
                        # floor is load-bearing — and it tracks the version the suite
                        # actually runs, not the oldest one without the CVE.

[tool.poetry.group.dev.dependencies]
# No ruff, no mypy, no `types-*` here on purpose. luxlint runs ruff and mypy
# MOUNT-ONLY from its pinned image (`make lint` / `make mypy`), so a repo copy
# pins a version the gate never runs — it goes stale and tells you nothing — and
# luxlint bakes the fleet's stubs, so a `types-*` dependency here is read by
# nothing. A typed library whose stubs luxlint does not bake is a luxlint
# escalation, not a dependency in this file. Enforced by
# repo.guard_owned_tools_undeclared.
pytest = "^9.1.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
faker = "^40.39.0"
hypothesis = "^6.168"
mutmut = "^3.8"
import-linter = "^2.15"
ipython = "^9.17.1"

[build-system]
# Fleet's one build backend is hatchling (repo.hatchling_build_backend). Poetry stays the
# dependency manager — deps live in [tool.poetry], poetry.lock untouched.
requires = ["hatchling"]
build-backend = "hatchling.build"

# ruff / mypy / pytest config is fleet-owned by luxlint (byte-identical, emitted
# from the pinned image) — this repo intentionally carries none. See .luxlint.toml,
# `make lint` (luxlint ruff mount-only + the mypy tail) and `make test`
# (`pytest -c "$(luxlint --emit-config pytest)"`).
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

# 1. Layered architecture: lower layers cannot import from higher ones.
[[tool.importlinter.contracts]]
name = "Layered architecture: routers → services → crud → models"
type = "layers"
layers = [
    "app.api.v1.routers : app.web.routers",
    "app.services.views",
    "app.services.core",
    "app.crud",
    "app.models",
]

# 2. Web routers must go through view services — not core or crud directly.
[[tool.importlinter.contracts]]
name = "Web routers do not import core services or crud directly"
type = "forbidden"
source_modules = ["app.web.routers"]
forbidden_modules = ["app.services.core", "app.crud"]
allow_indirect_imports = true

# 3. JSON API routers must go through core services — not view services or crud.
[[tool.importlinter.contracts]]
name = "API routers do not import view services or crud directly"
type = "forbidden"
source_modules = ["app.api.v1.routers"]
forbidden_modules = ["app.services.views", "app.crud"]
allow_indirect_imports = true

# 4. View services do not compose other view services.
[[tool.importlinter.contracts]]
name = "View services do not import other view services"
type = "independence"
modules = ["app.services.views"]
ignore_imports = [
    "app.services.views.status_pages_view_service -> app.services.views._dashboard_render",
]

# 5. Core services must not depend on view services or routers.
[[tool.importlinter.contracts]]
name = "Core services do not import view services or routers"
type = "forbidden"
source_modules = ["app.services.core"]
forbidden_modules = ["app.services.views", "app.api", "app.web"]
allow_indirect_imports = true

# 6. CRUD must not depend on services or routers.
[[tool.importlinter.contracts]]
name = "CRUD does not import services or routers"
type = "forbidden"
source_modules = ["app.crud"]
forbidden_modules = ["app.services", "app.api", "app.web"]
allow_indirect_imports = true
