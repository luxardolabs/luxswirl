<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up - LuxSwirl Monitoring</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/css/app.css?v={{ static_version }}">

    <!-- Fonts -->
    <link rel="stylesheet" href="/static/fonts/inter.css?v={{ static_version }}">

    <style>
        /* Hide controls but keep in DOM for future Easter egg */
        #logo-controls {
            display: none;
        }

        /* Full viewport background logo */
        #logo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 200px));
        }

        /* The emitted first-admin form, in the glass card's style */
        .admin-setup-form { display: flex; flex-direction: column; gap: 0.5rem; }
        .admin-setup-form h1 { display: none; }
        .admin-setup-form p { font-size: 0.875rem; color: var(--tw-prose-body, #94a3b8); margin-bottom: 0.5rem; }
        .admin-setup-form label { font-size: 0.875rem; font-weight: 500; color: #e2e8f0; margin-top: 0.5rem; }
        .admin-setup-form input { width: 100%; padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid rgba(148, 163, 184, 0.3); background: rgba(15, 23, 42, 0.6); color: #e2e8f0; }
        .admin-setup-form button { margin-top: 1rem; width: 100%; padding: 0.625rem 1rem; border-radius: 0.5rem; background: #0284c7; color: #fff; font-weight: 600; }
        .admin-setup-form .admin-setup-error { padding: 0.75rem 1rem; border-radius: 0.5rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }

        /* Setup content overlay */
        #login-content {
            position: relative;
            z-index: 10;
            margin-top: 250px;
        }
    </style>
</head>
<body class="font-sans antialiased bg-dark-bg-primary">
    <!-- Full-screen animated logo background -->
    <div id="logo-background">
        <div id="canvas-container"></div>
    </div>

    <!-- Setup form overlay -->
    <div id="login-content" class="min-h-screen flex flex-col items-center justify-center px-4">
        <!-- Setup Card -->
        <div class="w-full max-w-md">
            <div class="glass-card">
                <!-- Branding (inside the card so it stays legible over the animated globe) -->
                <div class="mb-6 text-center">
                    <h1 class="text-2xl font-bold text-dark-text-primary">Welcome to LuxSwirl</h1>
                    <p class="mt-1 text-sm text-dark-text-muted">Create your administrator account to get started</p>
                </div>

                <!-- First-admin form (luxarch admin-bootstrap-form): a one-time token from the
                     server log gates it, so only whoever can read the log can claim this install. -->
                {% include "partials/admin_setup_form.html" %}
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center text-xs text-dark-text-muted">
                <p>LuxSwirl Monitoring &copy; 2026 Luxardo Labs</p>
                <p class="mt-1">High-performance monitoring platform</p>
            </div>
        </div>
    </div>

    <!-- Hidden controls for future Easter egg -->
    <div id="logo-controls">
        <!-- Controls will go here if we add Easter egg later -->
    </div>

    <!-- Animated logo initialization -->
    <script type="module" src="/static/js/login-init.js?v={{ static_version }}"></script>
</body>
</html>
