<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up - LuxSwirl Monitoring</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/static/css/app.css?v={{ static_version }}">

    <!-- Fonts -->
    <link rel="stylesheet" href="/static/fonts/inter.css?v={{ static_version }}">

</head>
<body class="font-sans antialiased bg-dark-bg-primary logo-backdrop-page">
    <!-- Full-screen animated logo background -->
    <div id="logo-background">
        <div id="canvas-container"></div>
    </div>

    <!-- Setup form overlay -->
    <div id="login-content" class="min-h-screen flex flex-col items-center justify-center px-4">
        <!-- Setup Card -->
        <div class="w-full max-w-md">
            <div class="glass-card">
                <!-- Branding (inside the card so it stays legible over the animated globe) -->
                <div class="mb-6 text-center">
                    <h1 class="text-2xl font-bold text-dark-text-primary">Welcome to LuxSwirl</h1>
                    <p class="mt-1 text-sm text-dark-text-muted">Create your administrator account to get started</p>
                </div>

                <!-- First-admin form (luxarch admin-bootstrap-form): a one-time token from the
                     server log gates it, so only whoever can read the log can claim this install. -->
                {% include "partials/admin_setup_form.html" %}
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center text-xs text-dark-text-muted">
                <p>LuxSwirl Monitoring &copy; 2026 Luxardo Labs</p>
                <p class="mt-1">High-performance monitoring platform</p>
            </div>
        </div>
    </div>

    <!-- Hidden controls for future Easter egg -->
    <div id="logo-controls">
        <!-- Controls will go here if we add Easter egg later -->
    </div>

    <!-- Animated logo initialization -->
    <script type="module" src="/static/js/login-init.js?v={{ static_version }}"></script>
</body>
</html>
