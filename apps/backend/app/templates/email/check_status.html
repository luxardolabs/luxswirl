<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: {{ status_color }}; color: white; padding: 20px; border-radius: 8px 8px 0 0; }
        .content { background: #f9fafb; padding: 20px; border: 1px solid #e5e7eb; border-radius: 0 0 8px 8px; }
        .field { margin-bottom: 12px; }
        .label { font-weight: 600; color: #374151; }
        .value { color: #6b7280; }
        .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin: 0;">{{ status_text }} {{ check_name }}</h2>
        </div>
        <div class="content">
            {% for label, value, color in fields %}
            <div class="field">
                <span class="label">{{ label }}:</span>
                <span class="value"{% if color %} style="color: {{ color }}; font-weight: 600;"{% endif %}>{{ value }}</span>
            </div>
            {% endfor %}
            {% if error_message %}
            <div class="field">
                <span class="label">Error:</span>
                <span class="value" style="color: #dc2626;">{{ error_message }}</span>
            </div>
            {% endif %}
            {% if http_status_code %}
            <div class="field">
                <span class="label">HTTP Status:</span>
                <span class="value">{{ http_status_code }}</span>
            </div>
            {% endif %}
        </div>
        <div class="footer">
            Sent by LuxSwirl Monitoring System
        </div>
    </div>
</body>
</html>
