[project]
name = "luxswirl-agent"
license = "AGPL-3.0-or-later"
# version: single source is the repo-root VERSION file (repo.version_single_source), read by
# hatchling (repo.hatchling_build_backend). dependencies + requires-python stay Poetry-sourced
# from [tool.poetry] below (declared dynamic so Poetry, not [project], owns them). No static
# version literal anywhere in the repo.
dynamic = ["version", "dependencies", "requires-python"]

[tool.hatch.version]
path = "../../VERSION"
# VERSION is a bare version string. Hatchling's default regex looks for
# `__version__ = "..."`, matches nothing here, and the wheel build dies with
# "unable to parse the version from the file" (repo.hatch_version_source_buildable).
pattern = "(?P<version>.+)"

[tool.poetry]
# App: deployed via `poetry install --no-root`, never packaged → non-package mode. Poetry manages
# deps (below) but does not build/version the root, which is what allows the dynamic version above
# (poetry package-mode would otherwise require a static [tool.poetry.version]).
name = "luxswirl-agent"
description = "LuxSwirl observability platform — health-check agent"
authors = ["Luxardo Labs"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
# HTTP client (checks + reporting to server)
httpx = "^0.28.1"

# Transitive-dependency CVE floor — the parent's own range still admits the
# vulnerable version, so a re-lock alone cannot raise it.
typing-extensions = ">=4.16.0"  # anyio 4.14.2 imports typing_extensions.sentinel
                                # (added in 4.16) WITHOUT declaring the floor, so a
                                # resolve picks 4.15 and every import of fastapi dies
anyio = ">=4.14.2"     # CVE-2026-63374 (IDNA TLS hostname) + CVE-2026-64847
                       # (undrained worker stderr pipe); via starlette/httpx

# Credentials encryption (Fernet)
cryptography = "^50.0.0"  # CVE-2026-69247/69248/69249 + GHSA-537c-gmf6-5ccf floor

# Config / schema models
pydantic = "^2.13.5"

# Logging (shared/logger.py)
python-json-logger = "^4.2.0"

# Config files (shared/config.py)
pyyaml = "^6.0"

# Self-monitoring metrics
psutil = "^7.1.2"

# UUID v7 (time-ordered UUIDs)
uuid7 = "^0.1.0"

# Check-type drivers (imported lazily inside each check's run()):
playwright = "^1.63.0"      # synthetic checks
jsonata-python = "^0.7.0"   # JSON API checks (Uptime Kuma compatible)
aiomysql = "^0.3.2"         # MySQL checks
asyncpg = "^0.31.0"         # PostgreSQL checks
dnspython = "^2.7.0"        # DNS checks

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.3.0"
ruff = "^0.16.7"
mypy = "^2.3.1"

[build-system]
# Fleet's one build backend is hatchling (repo.hatchling_build_backend). Poetry stays the
# dependency manager — deps live in [tool.poetry], poetry.lock untouched.
requires = ["hatchling"]
build-backend = "hatchling.build"

# ruff / mypy config is fleet-owned by luxlint (byte-identical, emitted from the
# pinned image) — this repo intentionally carries none. See .luxlint.toml and
# `make lint` (luxlint ruff mount-only + the mypy tail).
#
# pytest config is NOT yet migrated to the canonical luxlint tail (see the backend
# pyproject note): test.no_local_pytest_config stays RED (tracked burn-down); the
# local config below keeps `make test` working meanwhile.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
# "." = apps/agent (resolves `import app.*`); ".." = apps/ (resolves `import shared.*`).
pythonpath = [".", ".."]
