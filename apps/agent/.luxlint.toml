# The agent suite's own coverage floor: `make test` runs it as the `agent` suite
# (TEST_SUITES in the Makefile). The repo root's .luxlint.toml lints both components.
[source]
paths = ["apps/agent/app"]

[test]
# The whole percent of branch coverage `make test` last measured for the agent
# suite. It is raised as tests land and never lowered.
coverage_min = 48
